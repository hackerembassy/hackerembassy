name: E2E Tests

on:
  pull_request:
  # Site Deployment runs these before deploying
  workflow_call:
  # Changes that don't trigger a deployment still get tested on main
  push:
    branches:
      - main
    paths:
      - "cypress/**"
      - "cypress.config.js"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/test.yml"

jobs:
  e2e-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Cypress run
        uses: cypress-io/github-action@4ce68f262a3888d22cf3175d62010a145ba737ee # v7.4.8
        with:
          start: npm run start:ci
          wait-on: "http://localhost:8080"
          browser: chrome
